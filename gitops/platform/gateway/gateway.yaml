# One shared, global external Application Load Balancer for all tenants. Routes (HTTPRoute) live
# in tenant namespaces; only namespaces labelled gateway-access=true may attach.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  namespace: platform-gateway
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: {gateway-access: "true"}
  addresses:
    - type: NamedAddress
      value: platform-gateway-ip      # reserved in Terraform
