# Identities for tenant workloads. No annotations, no keys: access to GCP is granted in Terraform
# directly to the Workload Identity principal  ns/<namespace>/sa/reader  (team-a has a bucket
# grant, team-b deliberately has none; scripts/test.sh proves the difference).
apiVersion: v1
kind: ServiceAccount
metadata: {name: reader, namespace: team-a}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: reader, namespace: team-b}
