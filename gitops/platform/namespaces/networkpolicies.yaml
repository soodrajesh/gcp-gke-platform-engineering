# Zero-trust baseline: deny everything, then allow only what each tenant needs.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: shop-staging
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-baseline
  namespace: shop-staging
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:                                  # same-namespace traffic only
        - podSelector: {}
    - from:                                  # Managed Prometheus scrapes /metrics
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: gke-gmp-system}}
    - from:                                  # Google Front Ends / health checkers -> pods (container-native LB)
        - ipBlock: {cidr: 130.211.0.0/22}
        - ipBlock: {cidr: 35.191.0.0/16}
  egress:
    - to:                                    # same-namespace traffic
        - podSelector: {}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:                                    # GKE metadata server (Workload Identity token exchange)
        - ipBlock: {cidr: 169.254.169.252/32}
        - ipBlock: {cidr: 169.254.169.254/32}
---
