apiVersion: v1
kind: Service
metadata:
  name: shop
  labels: {app: shop, team: shop}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'   # container-native load balancing (pod IPs as backends)
spec:
  type: ClusterIP
  selector: {app: shop}
  ports:
    - {name: http, port: 80, targetPort: http}
