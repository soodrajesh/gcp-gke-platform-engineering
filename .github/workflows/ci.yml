name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: app/requirements-dev.txt }
      - run: pip install -r app/requirements-dev.txt
      - run: ruff check app && ruff format --check app
      - run: pytest -q

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.10.5" }
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false && terraform -chdir=terraform validate
      - uses: bridgecrewio/checkov-action@v12
        with: { directory: terraform, framework: terraform, soft_fail: true, output_format: cli }
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { scan-type: fs, scanners: "vuln,secret,misconfig", severity: "HIGH,CRITICAL", exit-code: "0" }

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Render + validate (built-in schemas + CRD catalog)
        run: |
          mkdir -p /tmp/out
          for o in staging prod; do kubectl kustomize k8s/overlays/$o > /tmp/out/$o.yaml; done
          kubeconform -summary -strict -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            gitops/platform gitops/apps gitops/bootstrap/project.yaml gitops/bootstrap/root.yaml /tmp/out

  admission-policies:
    # Real API server (kind), real CEL evaluation: every policy must deny what it should and allow the rest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with: { cluster_name: policy-test }
      - run: |
          kubectl apply -f gitops/platform/namespaces/namespaces.yaml -f gitops/platform/policies/policies.yaml
          sleep 10
          tests/admission-policies.sh kind-policy-test team-a

  plan:
    if: github.event_name == 'pull_request' && vars.WIF_PROVIDER != ''
    needs: [iac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_PLAN_SA }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.10.5" }
      - run: terraform -chdir=terraform init -backend-config="bucket=${{ vars.GCP_PROJECT }}-tfstate"
      - run: >
          terraform -chdir=terraform plan -lock=false -no-color
          -var project_id=${{ vars.GCP_PROJECT }} -var billing_account_id=${{ vars.BILLING_ACCOUNT }}
          -var alert_email=${{ vars.ALERT_EMAIL }} -var admin_email=${{ vars.ALERT_EMAIL }}
          -var authorized_cidr=203.0.113.1/32
