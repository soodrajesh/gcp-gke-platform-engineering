name: release
# Build -> scan -> sign -> Cloud Deploy release to staging. Production promotion stays a
# deliberate, approved step in Cloud Deploy (see docs/runbooks/05-release-and-rollback.md).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "k8s/**", "skaffold.yaml", "cloudbuild.yaml"]

permissions:
  contents: read
  id-token: write

concurrency: { group: release, cancel-in-progress: false }

jobs:
  release:
    environment: prod
    if: vars.WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    env: { PROJECT: "${{ vars.GCP_PROJECT }}", REGION: europe-west1 }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build, scan, attest
        run: |
          TAG="v${GITHUB_SHA::8}"
          REPO="$REGION-docker.pkg.dev/$PROJECT/apps"
          KEYRING=$(gcloud kms keyrings list --location "$REGION" --project "$PROJECT" --filter="name~plat-binauthz" --format='value(name.basename())' | head -1)
          gcloud builds submit --project "$PROJECT" --region "$REGION" --config cloudbuild.yaml \
            --service-account "projects/$PROJECT/serviceAccounts/plat-build@$PROJECT.iam.gserviceaccount.com" \
            --gcs-source-staging-dir "gs://$PROJECT-gke-build-staging/src" \
            --substitutions "_REPO=$REPO,_TAG=$TAG,_KMS_KEYRING=$KEYRING" .
          DIGEST=$(gcloud artifacts docker images describe "$REPO/shop:$TAG" --format='get(image_summary.digest)')
          echo "IMG=$REPO/shop@$DIGEST" >> "$GITHUB_ENV"; echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Create Cloud Deploy release (auto-deploys to staging)
        run: |
          mkdir /tmp/src && cp -R k8s skaffold.yaml /tmp/src/
          gcloud deploy releases create "rel-${TAG//./-}" --project "$PROJECT" --region "$REGION" --delivery-pipeline shop \
            --source /tmp/src --skaffold-file skaffold.yaml --images "shop=$IMG" \
            --gcs-source-staging-dir "gs://$PROJECT-gke-build-staging/deploy-src"
